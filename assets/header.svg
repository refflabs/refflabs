<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Reffael Evindonta, Software Engineering Student">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e0def4" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c4a7e7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#eb6f92" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#eb6f92" stop-opacity="0"/>
    </radialGradient>
  <clipPath id="t1"><rect class="t t1" x="20" y="71" width="470" height="24"/></clipPath><clipPath id="t2"><rect class="t t2" x="20" y="97" width="470" height="24"/></clipPath><clipPath id="t3"><rect class="t t3" x="20" y="139" width="470" height="24"/></clipPath><clipPath id="t4"><rect class="t t4" x="20" y="165" width="470" height="24"/></clipPath><clipPath id="t5"><rect class="t t5" x="20" y="207" width="470" height="24"/></clipPath><clipPath id="t6"><rect class="t t6" x="20" y="233" width="470" height="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    /* masuk: naik + fade */
    .in{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
    .c1{animation-delay:.9s}.c2{animation-delay:1s}.c3{animation-delay:1.1s}.c4{animation-delay:1.2s}.c5{animation-delay:1.3s}
    /* cahaya latar bergerak */
    .float1{animation:drift1 14s ease-in-out infinite}
    .float2{animation:drift2 18s ease-in-out infinite}
    @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-120px,40px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,-30px)}}
    /* garis scan */
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(460px)}}
    /* terminal: ketik per baris, berulang 12 detik */
    .t{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:type 12s steps(28) infinite}
    @keyframes type{0%{transform:scaleX(0)}6%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .t1{animation-delay:1.4s}.t2{animation-delay:2.2s}.t3{animation-delay:3s}.t4{animation-delay:3.8s}.t5{animation-delay:4.6s}.t6{animation-delay:5.4s}
    .term{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) .6s forwards}
    .chipglow{animation:chip 3.6s ease-in-out infinite}
    @keyframes chip{0%,100%{opacity:.0}50%{opacity:.5}}
  </style>

  <rect width="1280" height="420" rx="24" fill="#191724"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
  <g clip-path="url(#card)">
    <rect class="float1" x="-200" y="-200" width="1680" height="820" fill="url(#glow)"/>
    <rect class="float2" x="-200" y="-200" width="1680" height="820" fill="url(#glow2)"/>
    <rect class="scan" x="0" y="0" width="1280" height="2" fill="#e0def4" fill-opacity="0.05"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#26233a"/>

  <!-- kiri: identitas -->
  <text x="72" y="104" class="mono in d1" font-size="18" fill="#908caa">~/refflabs</text>
  <text x="68" y="186" class="sans in d2" font-size="64" font-weight="800" fill="#e0def4">Reffael</text>
  <text x="68" y="258" class="sans in d3" font-size="64" font-weight="800" fill="#ebbcba">Evindonta</text>
  <text x="72" y="304" class="sans in d4" font-size="21" fill="#908caa">Software Engineering Student · Politeknik Caltex Riau</text>

  <g class="sans" font-size="16" font-weight="600">
    <g class="in c1"><rect x="72" y="332" width="68" height="34" rx="17" fill="#26233a"/><text x="106" y="354" text-anchor="middle" fill="#9ccfd8">Web</text></g>
    <g class="in c2"><rect x="150" y="332" width="54" height="34" rx="17" fill="#26233a"/><text x="177" y="354" text-anchor="middle" fill="#c4a7e7">AI</text></g>
    <g class="in c3"><rect x="214" y="332" width="96" height="34" rx="17" fill="#26233a"/><text x="262" y="354" text-anchor="middle" fill="#f6c177">Android</text></g>
    <g class="in c4"><rect x="320" y="332" width="134" height="34" rx="17" fill="#26233a"/><text x="387" y="354" text-anchor="middle" fill="#9ccfd8">WhatsApp Bots</text></g>
    <g class="in c5"><rect x="464" y="332" width="104" height="34" rx="17" fill="#26233a"/><text x="516" y="354" text-anchor="middle" fill="#eb6f92">Security</text></g>
  </g>

  <!-- kanan: terminal -->
  <g transform="translate(700 64)"><g class="term">
    <rect width="512" height="292" rx="16" fill="#1f1d2e" stroke="#26233a"/>
    <rect width="512" height="44" rx="16" fill="#26233a"/>
    <rect y="28" width="512" height="16" fill="#26233a"/>
    <circle cx="26" cy="22" r="6" fill="#eb6f92"/>
    <circle cx="48" cy="22" r="6" fill="#f6c177"/>
    <circle cx="70" cy="22" r="6" fill="#9ccfd8"/>
    <text x="256" y="27" text-anchor="middle" class="mono" font-size="13" fill="#6e6a86">reffael@pcr: ~</text>

    <g class="mono" font-size="16">
      <text x="28" y="88" clip-path="url(#t1)"><tspan fill="#9ccfd8">$</tspan><tspan fill="#e0def4"> whoami</tspan></text>
      <text x="28" y="114" clip-path="url(#t2)" fill="#908caa">builds web apps, AI tools &amp; WhatsApp bots</text>

      <text x="28" y="156" clip-path="url(#t3)"><tspan fill="#9ccfd8">$</tspan><tspan fill="#e0def4"> now</tspan></text>
      <text x="28" y="182" clip-path="url(#t4)"><tspan fill="#908caa">shipping </tspan><tspan fill="#ebbcba">AZENKIVO</tspan><tspan fill="#908caa"> · Android · Kotlin</tspan></text>

      <text x="28" y="224" clip-path="url(#t5)"><tspan fill="#9ccfd8">$</tspan><tspan fill="#e0def4"> exploring</tspan></text>
      <text x="28" y="250" clip-path="url(#t6)" fill="#908caa">networking · cybersecurity · wargames</text>

      <text x="28" y="278"><tspan fill="#9ccfd8">$</tspan></text>
      <rect x="46" y="264" width="10" height="18" fill="#e0def4" class="cursor"/>
    </g>
  </g></g>
</svg>
