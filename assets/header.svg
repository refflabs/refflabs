    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect width="1280" height="420" rx="24" fill="#191724"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#26233a"/>

