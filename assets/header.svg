<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Reffael Evindonta, Software Engineering Student">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e0def4" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c4a7e7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#eb6f92" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#eb6f92" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
