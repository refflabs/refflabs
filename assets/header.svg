  <text x="68" y="186" class="sans" font-size="64" font-weight="800" fill="#e0def4">Reffael</text>
  <text x="68" y="258" class="sans" font-size="64" font-weight="800" fill="#ebbcba">Evindonta</text>
  <text x="72" y="304" class="sans" font-size="21" fill="#908caa">Software Engineering Student · Politeknik Caltex Riau</text>

  <g class="sans" font-size="16" font-weight="600">
    <rect x="72" y="332" width="68" height="34" rx="17" fill="#26233a"/><text x="106" y="354" text-anchor="middle" fill="#9ccfd8">Web</text>
    <rect x="150" y="332" width="54" height="34" rx="17" fill="#26233a"/><text x="177" y="354" text-anchor="middle" fill="#c4a7e7">AI</text>
    <rect x="214" y="332" width="96" height="34" rx="17" fill="#26233a"/><text x="262" y="354" text-anchor="middle" fill="#f6c177">Android</text>
    <rect x="320" y="332" width="134" height="34" rx="17" fill="#26233a"/><text x="387" y="354" text-anchor="middle" fill="#9ccfd8">WhatsApp Bots</text>
    <rect x="464" y="332" width="104" height="34" rx="17" fill="#26233a"/><text x="516" y="354" text-anchor="middle" fill="#eb6f92">Security</text>
  </g>

  <!-- kanan: terminal -->
  <g transform="translate(700 64)">
    <rect width="512" height="292" rx="16" fill="#1f1d2e" stroke="#26233a"/>
    <rect width="512" height="44" rx="16" fill="#26233a"/>
    <rect y="28" width="512" height="16" fill="#26233a"/>
    <circle cx="26" cy="22" r="6" fill="#eb6f92"/>
